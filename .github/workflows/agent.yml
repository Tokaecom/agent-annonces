name: Agent Annonces

# Déclencheurs : toutes les 5 minutes en cron + bouton manuel "Run workflow" sur GitHub
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# Permissions : le job a besoin de pouvoir commit le seen_posts.json mis à jour
permissions:
  contents: write

# Évite que deux runs se chevauchent (un cycle peut prendre > 5 min si beaucoup
# de posts à analyser via l'API Claude). cancel-in-progress: false = on attend
# la fin du run en cours plutôt que de l'annuler.
concurrency:
  group: agent-annonces-poll
  cancel-in-progress: false

jobs:
  poll:
    name: Polling Truth Social + analyse + Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Lancement de l'agent (un seul cycle)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py --once

      - name: Commit des fichiers d'état mis à jour
        run: |
          git config user.name "agent-annonces-bot"
          git config user.email "actions@github.com"
          # On inclut seen_posts.json (Trump), seen_forexlive.json (ForexLive) et recent_topics.json (anti-doublon)
          git add data/seen_posts.json data/seen_forexlive.json data/recent_topics.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Pas de changement à committer."
          else
            git commit -m "chore: update state files [skip ci]"
            git push
          fi
